<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle Maker · דפי עבודה ומשחקים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7ECF1; --panel:#FFFFFF; --ink:#18222E; --muted:#596676; --line:#C7D0DA;
  --accent:#1F5C8C; --accent-ink:#FFFFFF; --field:#F6F8FA;
  --warn-bg:#FFF2DB; --warn-ink:#734600; --ok-ink:#2D6A3E;
  --paper:#FFFFFF; --paper-ink:#000000; --paper-muted:#555555; --hl:rgba(31,92,140,.22);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F151C; --panel:#18212B; --ink:#E4EBF2; --muted:#98A7B6; --line:#2F3B48;
    --accent:#72AADA; --accent-ink:#0C1824; --field:#121A22;
    --warn-bg:#3A2A10; --warn-ink:#F2C67A; --ok-ink:#8FD3A1; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151C; --panel:#18212B; --ink:#E4EBF2; --muted:#98A7B6; --line:#2F3B48;
  --accent:#72AADA; --accent-ink:#0C1824; --field:#121A22;
  --warn-bg:#3A2A10; --warn-ink:#F2C67A; --ok-ink:#8FD3A1; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Heebo,"Segoe UI",Arial,sans-serif}
.app-head{max-width:1240px;margin:0 auto;padding:28px 20px 8px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.app-head .he{font-family:"Frank Ruhl Libre","Times New Roman",serif;font-weight:900;font-size:clamp(30px,5vw,46px);line-height:1;margin:0;direction:rtl}
.app-head p{margin:0;color:var(--muted)}
.layout{max-width:1240px;margin:0 auto;padding:12px 20px 40px;display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:24px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.tabs{display:flex;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);font:500 15px Heebo,sans-serif;padding:8px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
label.f{display:block;font-weight:500;margin:12px 0 4px}
.hint{color:var(--muted);font-weight:400;font-size:13px}
input[type=text],textarea,select{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:15px Heebo,sans-serif}
textarea{min-height:190px;resize:vertical;font-family:"Frank Ruhl Libre",serif;font-size:18px;line-height:1.5}
.check{display:flex;gap:8px;align-items:flex-start;margin:10px 0;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px}
.row>*{flex:1}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.btns{display:flex;gap:10px;margin-top:10px}
.btns button{flex:1;padding:10px;border-radius:7px;font:500 15px Heebo,sans-serif;cursor:pointer;border:1px solid var(--accent)}
.btn-main{background:var(--accent);color:var(--accent-ink)}
.btn-alt{background:transparent;color:var(--accent)}
.status{margin-top:14px;font-size:14px;border-radius:6px;padding:8px 10px}
.status.ok{color:var(--ok-ink);padding:0}
.status.warn{background:var(--warn-bg);color:var(--warn-ink)}
.status .he{font-family:"Frank Ruhl Libre",serif;font-size:16px}
.hidden{display:none!important}

.preview{min-width:0}
.sheet{background:var(--paper);color:var(--paper-ink);max-width:780px;margin:0 auto 24px;padding:44px 48px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.18);overflow-x:auto;font-family:"Frank Ruhl Libre","Times New Roman",serif}
.sheet h1{font-size:34px;font-weight:900;margin:0;line-height:1.1}
.sheet h2{font-size:20px;font-weight:700;margin:4px 0 0;color:var(--paper-muted)}
.sheet .top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;border-bottom:2px solid var(--paper-ink);padding-bottom:10px;margin-bottom:12px}
.sheet .name{font-size:18px;white-space:nowrap}
.sheet .name span{display:inline-block;width:170px;border-bottom:1px solid var(--paper-ink);margin-inline-start:6px}
.sheet .instr{font-size:19px;margin:0 0 18px}
.center{display:flex;justify-content:center}
.wsframe{border:2px solid var(--paper-ink);border-radius:6px;padding:8px;display:inline-block}
.wsinner{position:relative}
.wsinner svg{position:absolute;inset:0;pointer-events:none}
.wsgrid{position:relative;display:grid}
.wsgrid div{display:flex;align-items:center;justify-content:center;font-weight:700}
.wordbank{display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:center;margin-top:22px;font-size:21px;border:1px solid var(--paper-ink);border-radius:6px;padding:12px 16px}
.cwgrid{display:grid;margin:6px auto 0}
.cwgrid .box{position:relative;box-sizing:border-box;border:0 solid #000;border-bottom-width:1.5px;border-inline-end-width:1.5px;display:flex;align-items:center;justify-content:center;font-weight:700}
.cwgrid .box i{position:absolute;top:1px;inset-inline-start:3px;font-style:normal;font-family:Heebo,sans-serif;font-weight:500;line-height:1}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:10px 36px;margin-top:26px;font-size:18px}
@media (max-width:560px){.clues{grid-template-columns:1fr}.sheet{padding:28px 20px}}
.clues h3{font-size:21px;margin:0 0 6px;border-bottom:1px solid var(--paper-ink)}
.clues ol{list-style:none;margin:0;padding:0}
.clues li{margin:0 0 6px;display:flex;gap:6px}
.clues li b{min-width:1.6em}
.clues .len{color:var(--paper-muted);white-space:nowrap}
.empty{font-family:Heebo,sans-serif;color:var(--paper-muted);text-align:center;padding:60px 0;direction:ltr}

.langbar{margin-bottom:14px}
.langbar .tabs{margin-bottom:0}
.langbar .tabs button{font-family:"Frank Ruhl Libre",Heebo,serif;font-size:16px}
.small{font-size:13px;color:var(--muted);margin:8px 0 0}
.btns button:disabled{opacity:.55;cursor:progress}
.sheet[dir=ltr] .clues li b{min-width:1.8em}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-bottom:16px}
.types button{border:1px solid var(--line);background:var(--field);color:var(--ink);font:500 14px Heebo,sans-serif;padding:7px 8px;border-radius:6px;cursor:pointer;text-align:start}
.types button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.panel input[type=number]{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:15px Heebo,sans-serif}
.pagebox{display:flex;flex-direction:column}
.contd{height:6px}
.mzlab{display:flex;font:700 18px Heebo,sans-serif;margin:0 auto;padding:0 2px}
.mzwrap{margin:4px auto 0}
.dots{position:relative;margin:4px auto 0}
.dots svg{position:absolute;inset:0}
.dots span{position:absolute;transform:translate(-50%,-50%);font:500 14px/1 Heebo,sans-serif;color:#000;white-space:nowrap}
.trace img{display:block;width:100%;margin:0 0 6px}
.codekey{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;border:1px solid #000;border-radius:6px;padding:10px;margin:0 0 26px}
.codekey div{display:flex;flex-direction:column;align-items:center;width:38px;border:1px solid #000;border-radius:4px;overflow:hidden}
.codekey b{display:block;width:100%;text-align:center;font-size:20px;border-bottom:1px solid #000;padding:2px 0}
.sym{font-style:normal;font-family:"Noto Sans Symbols 2","Noto Sans Symbols","Segoe UI Symbol",Heebo,sans-serif}
.codekey i{font-size:19px;padding:3px 0;font-family:"Noto Sans Symbols 2","Noto Sans Symbols","Segoe UI Symbol",Heebo,sans-serif;font-style:normal}
.codekey.num i,.codemsg.num i{font-family:Heebo,sans-serif;font-weight:700}
.codemsg{display:flex;flex-wrap:wrap;gap:18px 30px;justify-content:center}
.cword{display:flex;gap:4px}
.ccell{display:flex;flex-direction:column;align-items:center;width:40px}
.ccell i{font-size:22px;font-style:normal;font-family:"Noto Sans Symbols 2","Noto Sans Symbols","Segoe UI Symbol",Heebo,sans-serif;height:30px;display:flex;align-items:center}
.ccell b{width:38px;height:42px;border-bottom:2px solid #000;display:flex;align-items:flex-end;justify-content:center;font-size:26px}
.rows{display:flex;flex-direction:column;gap:20px;font-size:20px}
.rowi{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rowi>b{min-width:1.6em}
.tiles{display:flex;gap:5px;flex-wrap:wrap}
.tile{width:40px;height:44px;border:1.5px solid #000;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700}
.tile.gap{border-style:dashed;border-color:#777}
.tile.gap em{font-style:normal;color:#000}
.ansline{flex:1;min-width:150px;border-bottom:1.5px solid #000;height:38px;font-size:24px;font-weight:700;display:flex;align-items:flex-end;padding:0 6px 2px}
.hintt{flex-basis:100%;color:#444;font-size:17px;margin-top:-6px;padding-inline-start:2.4em}
.bank{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;margin-top:24px;font-size:22px;font-weight:700;border:1px solid #000;border-radius:6px;padding:10px 14px}
.match{display:grid;grid-template-columns:1fr 120px 1fr;row-gap:24px;font-size:20px;align-items:center}
.match .mw{display:flex;align-items:center;gap:10px}
.match .mw.l{justify-content:space-between}
.match .mw.r{justify-content:space-between}
.match .pt{font-size:13px}
.mnum{display:inline-block;min-width:34px;border-bottom:1.5px solid #000;text-align:center;font-weight:700;height:28px}
.bcard{display:flex;flex-direction:column;align-items:center}
.bcard+.bcard{margin-top:28px;padding-top:24px;border-top:1.5px dashed #888}
.bcard .top{width:100%}
.bgrid{display:grid;border-top:2px solid #000;border-inline-start:2px solid #000;margin-top:6px}
.bgrid div{border-bottom:2px solid #000;border-inline-end:2px solid #000;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.bgrid .bfree{background:#e9e9e9;font-family:Heebo,sans-serif}
.slips{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px dashed #555;border-inline-start:1px dashed #555;margin-top:10px}
.slips div{border-bottom:1px dashed #555;border-inline-end:1px dashed #555;padding:16px 6px;text-align:center;font-size:20px;font-weight:700}
.cbgrid{display:grid;border-top:1px solid #777;border-inline-start:1px solid #777}
.cbgrid div{border-bottom:1px solid #777;border-inline-end:1px solid #777;display:flex;align-items:center;justify-content:center;font-family:Heebo,sans-serif;font-weight:500;line-height:1;white-space:nowrap;overflow:hidden}
.cbkey{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin:0 0 18px;font-size:18px}
.cbkey div{display:flex;align-items:center;gap:6px}
.cbkey b{font-family:Heebo,sans-serif;min-width:1.4em;text-align:center}
.cbkey i{display:inline-block;width:20px;height:20px;border:1px solid #000;border-radius:3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{
  @page{size:letter;margin:0}
  :root{padding:0}
  html,body{background:#fff}
  .app-head,.controls{display:none!important}
  .layout{display:block;padding:0;max-width:none}
  .sheet{box-shadow:none;margin:0;padding:0.5in;max-width:none;border-radius:0;overflow:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid}
  .sheet+.sheet{break-before:page}
}
</style>
</head>
<body>
<header class="app-head">
  <h1 class="he">דפי עבודה ומשחקים</h1>
  <p>Hebrew, Yiddish or English puzzles. Type your words, check the preview, print or download.</p>
</header>

<main class="layout">
  <section class="controls" aria-label="Puzzle settings">
    <div class="langbar">
      <label class="f" style="margin-top:0">Sheet language</label>
      <div class="tabs" role="tablist" aria-label="Sheet language">
        <button role="tab" data-lang="he" aria-selected="true">עברית</button>
        <button role="tab" data-lang="yi" aria-selected="false">אידיש</button>
        <button role="tab" data-lang="en" aria-selected="false" style="font-family:Heebo,sans-serif">English</button>
      </div>
    </div>
    <label class="f">Puzzle</label>
    <div class="types" role="tablist" id="types"></div>

    <div class="panel" data-type="search">
      <label class="f" for="wsTitle">Title</label><input type="text" id="wsTitle" dir="auto">
      <label class="f" for="wsInstr">Instructions</label><input type="text" id="wsInstr" dir="auto">
      <label class="f" for="wsWords">Words <span class="hint">one per line</span></label>
      <textarea id="wsWords" data-rebuild></textarea>
      <div class="row">
        <div><label class="f" for="wsSize">Grid size</label>
          <select id="wsSize" data-rebuild><option value="auto">Auto</option><option>10</option><option>12</option><option>14</option><option>16</option><option>18</option><option>20</option></select></div>
        <div><label class="f" for="wsLevel">Words run</label>
          <select id="wsLevel" data-rebuild><option value="easy" id="easyOpt">Right-to-left and down</option><option value="medium" selected>Plus diagonals</option><option value="hard">Every way, incl. backwards</option></select></div>
      </div>
      <label class="check"><input type="checkbox" id="wsBank" checked> Show the word list on the sheet</label>
      <label class="check" id="unfinalRow"><input type="checkbox" id="wsUnfinal" data-rebuild> Use regular letters for finals (ך becomes כ)</label>
    </div>

    <div class="panel" data-type="cross">
      <label class="f" for="cwTitle">Title</label><input type="text" id="cwTitle" dir="auto">
      <label class="f" for="cwInstr">Instructions</label><input type="text" id="cwInstr" dir="auto">
      <label class="f" for="cwWords">Words and clues <span class="hint">one per line: word - clue</span></label>
      <textarea id="cwWords" data-rebuild></textarea>
      <label class="check"><input type="checkbox" id="cwLen" checked> Show letter count after each clue</label>
    </div>

    <div class="panel" data-type="maze">
      <label class="f" for="mzTitle">Title</label><input type="text" id="mzTitle" dir="auto">
      <label class="f" for="mzInstr">Instructions</label><input type="text" id="mzInstr" dir="auto">
      <label class="f" for="mzStyle">Shape</label>
      <select id="mzStyle" data-rebuild><option value="rect">Square</option><option value="round">Round</option><option value="magen">Magen David</option><option value="heart">Heart</option><option value="star">Star</option><option value="apple">Apple</option><option value="fish">Fish</option><option value="house">House</option><option value="dreidel">Dreidel</option></select>
      <label class="f" for="mzSize">Difficulty</label>
      <select id="mzSize" data-rebuild><option value="7">Very easy</option><option value="10" selected>Easy</option><option value="14">Medium</option><option value="19">Hard</option><option value="26">Very hard</option></select>
    </div>

    <div class="panel" data-type="dots">
      <label class="f" for="dtTitle">Title</label><input type="text" id="dtTitle" dir="auto">
      <label class="f" for="dtInstr">Instructions</label><input type="text" id="dtInstr" dir="auto">
      <label class="f" for="dtShape">Picture</label><select id="dtShape" data-rebuild></select>
      <label class="f" for="dtLabel">Dots are labeled with</label>
      <select id="dtLabel"><option value="num">Numbers 1, 2, 3…</option><option value="abc">Letters in alphabet order</option></select>
      <label class="check"><input type="checkbox" id="dtStart" checked> Mark the first dot</label>
    </div>

    <div class="panel" data-type="trace">
      <label class="f" for="trTitle">Title</label><input type="text" id="trTitle" dir="auto">
      <label class="f" for="trInstr">Instructions</label><input type="text" id="trInstr" dir="auto">
      <label class="f" for="trWords">Words or short lines <span class="hint">one per line</span></label>
      <textarea id="trWords"></textarea>
      <div class="row">
        <div><label class="f" for="trSize">Letter size</label>
          <select id="trSize"><option value="44">Small</option><option value="64" selected>Medium</option><option value="90">Large</option></select></div>
        <div><label class="f" for="trRepeat">Times per line</label>
          <select id="trRepeat"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
      </div>
      <label class="f" for="trStyle">Letter style</label>
      <select id="trStyle"><option value="dots">Dotted outline</option><option value="gray">Light gray to write over</option></select>
      <label class="check"><input type="checkbox" id="trLines" checked> Writing lines</label>
      <label class="check"><input type="checkbox" id="trPractice" checked> Empty practice line after each word</label>
    </div>

    <div class="panel" data-type="code">
      <label class="f" for="cdTitle">Title</label><input type="text" id="cdTitle" dir="auto">
      <label class="f" for="cdInstr">Instructions</label><input type="text" id="cdInstr" dir="auto">
      <label class="f" for="cdWords">Secret message</label>
      <textarea id="cdWords" data-rebuild style="min-height:100px"></textarea>
      <label class="f" for="cdMode">Code</label>
      <select id="cdMode" data-rebuild><option value="sym">Picture symbols</option><option value="num">Numbers, mixed up</option><option value="ord">Numbers in alphabet order</option></select>
      <label class="check"><input type="checkbox" id="cdOnly" data-rebuild> Key shows only the letters in the message</label>
    </div>

    <div class="panel" data-type="scramble">
      <label class="f" for="scTitle">Title</label><input type="text" id="scTitle" dir="auto">
      <label class="f" for="scInstr">Instructions</label><input type="text" id="scInstr" dir="auto">
      <label class="f" for="scWords">Words <span class="hint">one per line; add “- hint” if you like</span></label>
      <textarea id="scWords" data-rebuild></textarea>
    </div>

    <div class="panel" data-type="missing">
      <label class="f" for="msTitle">Title</label><input type="text" id="msTitle" dir="auto">
      <label class="f" for="msInstr">Instructions</label><input type="text" id="msInstr" dir="auto">
      <label class="f" for="msWords">Words <span class="hint">one per line; add “- hint” if you like</span></label>
      <textarea id="msWords" data-rebuild></textarea>
      <label class="f" for="msHide">Letters to leave out</label>
      <select id="msHide" data-rebuild><option value="1" selected>1 per word</option><option value="2">2 per word</option><option value="half">About half</option></select>
      <label class="check"><input type="checkbox" id="msBank" checked> Show the missing letters at the bottom</label>
    </div>

    <div class="panel" data-type="match">
      <label class="f" for="mtTitle">Title</label><input type="text" id="mtTitle" dir="auto">
      <label class="f" for="mtInstr">Instructions</label><input type="text" id="mtInstr" dir="auto">
      <label class="f" for="mtWords">Pairs <span class="hint">one per line: word - meaning</span></label>
      <textarea id="mtWords" data-rebuild></textarea>
    </div>

    <div class="panel" data-type="bingo">
      <label class="f" for="bgTitle">Title</label><input type="text" id="bgTitle" dir="auto">
      <label class="f" for="bgWords">Words <span class="hint">one per line</span></label>
      <textarea id="bgWords" data-rebuild></textarea>
      <div class="row">
        <div><label class="f" for="bgSize">Card size</label>
          <select id="bgSize" data-rebuild><option value="3">3 × 3</option><option value="4" selected>4 × 4</option><option value="5">5 × 5</option></select></div>
        <div><label class="f" for="bgCount">Cards</label>
          <input type="number" id="bgCount" min="1" max="60" value="30" data-rebuild></div>
      </div>
      <label class="f" for="bgPer">Cards per page</label>
      <select id="bgPer"><option value="1">1 (big)</option><option value="2" selected>2 (cut in half)</option></select>
      <label class="check"><input type="checkbox" id="bgFree" checked data-rebuild> Free space in the middle (3 × 3 and 5 × 5)</label>
    </div>

    <div class="panel" data-type="color">
      <label class="f" for="cbTitle">Title</label><input type="text" id="cbTitle" dir="auto">
      <label class="f" for="cbInstr">Instructions</label><input type="text" id="cbInstr" dir="auto">
      <label class="f" for="cbPic">Picture</label>
      <select id="cbPic" data-rebuild><option value="apple">Apple</option><option value="house">House</option><option value="fish">Fish</option><option value="candle">Candle</option><option value="dreidel">Dreidel</option><option value="menorah">Menorah</option><option value="magen">Magen David</option><option value="heart">Heart</option></select>
      <label class="f" for="cbLabel">Squares show</label>
      <select id="cbLabel" data-rebuild><option value="num">Numbers</option><option value="abc">Letters</option><option value="add">Addition problems</option><option value="sub">Subtraction problems</option><option value="mul">Multiplication problems</option></select>
      <label class="check"><input type="checkbox" id="cbBg" data-rebuild> Number the background squares too (white)</label>
    </div>

    <label class="check hidden" id="marksRow"><input type="checkbox" id="yiMarks" data-rebuild checked> Keep Yiddish letter marks (אַ אָ)</label>
    <hr>

    e.ch.forEach((ch,k)=>{const key=K(r+dr*k,c+dc*k),cell=G.get(key)||{ch,dirs:''};cell.dirs+=d;G.set(key,cell)});
    b={r0:Math.min(b.r0,r),c0:Math.min(b.c0,c),r1:Math.max(b.r1,r+dr*(e.ch.length-1)),c1:Math.max(b.c1,c+dc*(e.ch.length-1))};placed.push({e,r,c,d});};

  order.forEach((e,i)=>{if(i===0)put(e,0,0,Math.random()<.5?'a':'d');else if(!placeOne(e))missed.push(e)});

  if(!entries.length)return {empty:true,skipped};

    const res=tryCross(order),size=Math.max(res.b.r1-res.b.r0,res.b.c1-res.b.c0);

/* ---------- maze ---------- */
/* Every maze is carved by a depth-first search over all its cells, which makes a "perfect" maze:
   every cell is reachable and there is exactly one path between any two cells. */

    if(!opts.length){stack.pop();continue}

  if(style==='rect'){const cols=size,rows=Math.round(cols*1.25);return gridMaze(cols,rows,new Array(cols*rows).fill(true),R)}

      if(has(r,c-1)?!L.has(i-1):true)d+=`M${x} ${y}v${cell}`;
      if(!has(r,c+1))d+=`M${x+cell} ${y}v${cell}`;

      if(!L.has(m.parent(x))){const [x0,y0]=P(i*Rr,a0),[x1,y1]=P(i*Rr,a1);d+=`M${x0} ${y0}A${i*Rr} ${i*Rr} 0 0 1 ${x1} ${y1}`}

const CB_MUL=[12,16,18,20,24,28,30,32,36,40,42,48];
function buildColor(){

  else if(mode==='mul')vals=shuffle(CB_MUL.slice()).slice(0,used.length);
  else vals=used.map((_,i)=>i+1);

  const prob=v=>{if(mode==='add'){const a=rnd(v+1);return `${a}+${v-a}`}

    return null};
  const cells=g.map(row=>row.split('').map(ch=>(ch==='.'&&!bg)?null:{ch,p:prob(valOf[ch])}));

function dotsArt(sh,key){

  const extra=sh.extra.map(e=>e.line?`<polyline points="${e.line.map(P).map(p=>p.join(',')).join(' ')}" fill="none" stroke="#000" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`
    :`<circle cx="${(e.circle[0]*k).toFixed(1)}" cy="${(e.circle[1]*k).toFixed(1)}" r="${(e.circle[2]*k).toFixed(1)}" fill="none" stroke="#000" stroke-width="2.5"/>`).join('');
  const line=key?`<polyline points="${(sh.closed?pts.concat([pts[0]]):pts).map(p=>p.join(',')).join(' ')}" fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round"/>`:'';

  return {html:`<div class="dots" style="width:${W}px;height:${W}px"><svg width="${W}" height="${W}" viewBox="-10 -10 ${W+20} ${W+20}" style="left:-10px;top:-10px;width:${W+20}px;height:${W+20}px">${extra}${line}${dots}</svg>${labels}</div>`,

/* ---------- tracing ---------- */
function buildTrace(){return {}}
function traceRow(text,size,repeat,style,ruled,blank){
  const SC=2,W=684,h=Math.round(size*1.55),c=document.createElement('canvas');c.width=W*SC;c.height=h*SC;
  const x=c.getContext('2d');x.scale(SC,SC);
  let fs=size;const setFont=()=>x.font=`${style==='dots'?700:500} ${fs}px Heebo, Arial, sans-serif`;setFont();
  const base=h*0.76,cap=x.measureText(lang==='en'?'H':'ב').actualBoundingBoxAscent||fs*.7;
  if(ruled){x.strokeStyle='#9a9a9a';x.lineWidth=1.2;
    const ln=y=>{x.beginPath();x.moveTo(4,y);x.lineTo(W-4,y);x.stroke()};
    ln(base);ln(base-cap);
    if(lang==='en'){const xh=x.measureText('x').actualBoundingBoxAscent||fs*.5;x.setLineDash([7,6]);ln(base-xh);x.setLineDash([])}}
  if(!blank&&text){
    const R=rtl();x.direction=R?'rtl':'ltr';x.textAlign=R?'right':'left';
    let tw=x.measureText(text).width;if(tw>W-20){fs=Math.floor(fs*(W-20)/tw);setFont();tw=x.measureText(text).width}
    let n=repeat;while(n>1&&n*tw+(n-1)*fs*.8>W-20)n--;
    const slot=(W-20)/n;
    for(let i=0;i<n;i++){const pos=10+i*slot,X=R?W-pos:pos;
      if(style==='dots'){x.setLineDash([0,Math.max(4,fs*.085)]);x.lineCap='round';x.lineWidth=Math.max(1.8,fs*.042);x.strokeStyle='#222';x.strokeText(text,X,base);x.setLineDash([])}
      else{x.fillStyle='#c4c4c4';x.fillText(text,X,base)}}
  }
  return {src:c.toDataURL('image/png'),h};
}
function viewTrace(){
  const words=lines('trWords').map(noPeMarks);
  if(!words.length)return emptyOut('Add at least one word to trace.');
  const size=+val('trSize'),rep=+val('trRepeat'),style=val('trStyle'),ruled=$('trLines').checked,prac=$('trPractice').checked;
  const rows=[];
  words.forEach(w=>{rows.push(traceRow(w,size,rep,style,ruled,false));if(prac)rows.push(traceRow('',size,rep,style,ruled,true))});
  const pages=[];let cur=head(val('trTitle'),val('trInstr')),used=150;
  rows.forEach(r=>{const hh=r.h+6;if(used+hh>950){pages.push(cur);cur='';used=0}
    cur+=`<div class="trace"><img alt="" src="${r.src}" style="height:${r.h}px;object-fit:contain"></div>`;used+=hh;});
  pages.push(cur);
  return {pages,keys:[],msg:`${words.length} ${words.length===1?'line':'lines'} on ${pages.length} ${pages.length===1?'page':'pages'}.`,ok:true};
}

/* ---------- secret code ---------- */
const SYMS=Array.from('★☆●○■□▲△▼▽◆◇♥♡♦♢♣♧♠♤♪♫✚✖✿❀☾☁✦✧◐◑◒◓⬟⬢⊕⊗⊙✱✶☼◎▣✕⬠⬡✪✤');
function buildCode(){
  const msg=lines('cdWords').map(l=>l.split(/\s+/).map(w=>letters(w,false)).filter(w=>w.length));
  const used=new Set(msg.flat(2));
  if(!used.size)return {empty:true};
  const order=L().order;
  let core=L().core;if(lang==='yi'&&!$('yiMarks').checked)core=[...new Set(core.map(c=>c[0]))];
  const set=new Set($('cdOnly').checked?used:[...core,...used]);
  const keyList=[...set].sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib)});
  let mode=val('cdMode');if(mode==='sym'&&keyList.length>SYMS.length)mode='num';
  const vals=mode==='sym'?shuffle(SYMS.slice()).slice(0,keyList.length):mode==='num'?shuffle(keyList.map((_,i)=>i+1)):keyList.map((_,i)=>i+1);
  const map={};keyList.forEach((l,i)=>map[l]=vals[i]);
  return {msg,keyList,map,mode};
}
function codeHtml(s,key){
  const num=s.mode!=='sym'?' num':'';
  const k=`<div class="codekey${num}">${s.keyList.map(l=>`<div><b>${esc(l)}</b><i>${esc(s.map[l])}</i></div>`).join('')}</div>`;
  const m=s.msg.map(line=>`<div class="codemsg${num}">${line.map(w=>`<div class="cword">${w.map(l=>`<div class="ccell"><i>${esc(s.map[l])}</i><b>${key?esc(l):''}</b></div>`).join('')}</div>`).join('')}</div>`).join('<div style="height:18px"></div>');
  return k+m;
}
function viewCode(s){
  if(s.empty)return emptyOut('Type a secret message to encode.');
  return {pages:[head(val('cdTitle'),val('cdInstr'))+codeHtml(s,false)],keys:[keyHead(val('cdTitle'))+codeHtml(s,true)],
    msg:`${s.msg.flat().length} words, ${s.keyList.length} letters in the key.`,ok:true};
}

/* ---------- word scramble ---------- */
function parseWords(id){const out=[],skipped=[];lines(id).forEach(l=>{const [w,h]=splitClue(l),ch=letters(w,false);if(ch.length<2)skipped.push(w);else out.push({w,h,ch})});return {out,skipped}}
function buildScramble(){
  const {out,skipped}=parseWords('scWords');
  out.forEach(o=>{let s=o.ch.slice();for(let t=0;t<25;t++){shuffle(s);if(s.join('|')!==o.ch.join('|'))break}o.s=s});
  return {items:out,skipped};
}
function viewScramble(s){
  if(!s.items.length)return {...emptyOut('Add at least one word to scramble.'),skipped:s.skipped};
  const body=key=>`<div class="rows">${s.items.map((o,i)=>`<div class="rowi"><b>${i+1}.</b><div class="tiles">${o.s.map(c=>`<div class="tile">${esc(c)}</div>`).join('')}</div><div class="ansline">${key?esc(o.w):''}</div>${o.h?`<div class="hintt">${esc(o.h)}</div>`:''}</div>`).join('')}</div>`;
  return {pages:[head(val('scTitle'),val('scInstr'))+body(false)],keys:[keyHead(val('scTitle'))+body(true)],skipped:s.skipped,msg:`${s.items.length} words.`,ok:true};
}

/* ---------- missing letters ---------- */
function buildMissing(){
  const {out,skipped}=parseWords('msWords'),mode=val('msHide');
  out.forEach(o=>{const n=o.ch.length,k=mode==='half'?Math.max(1,Math.floor(n/2)):Math.min(+mode,n-1);
    o.hide=new Set(shuffle([...o.ch.keys()]).slice(0,k))});
  return {items:out,skipped};
}
function viewMissing(s){
  if(!s.items.length)return {...emptyOut('Add at least one word.'),skipped:s.skipped};
  const body=key=>`<div class="rows">${s.items.map((o,i)=>`<div class="rowi"><b>${i+1}.</b><div class="tiles">${o.ch.map((c,j)=>o.hide.has(j)?`<div class="tile gap">${key?`<em>${esc(c)}</em>`:''}</div>`:`<div class="tile">${esc(c)}</div>`).join('')}</div>${o.h?`<div class="hintt">${esc(o.h)}</div>`:''}</div>`).join('')}</div>`;

/* ---------- matching ---------- */
function buildMatch(){
  const pairs=[],bad=[];lines('mtWords').forEach(l=>{const [w,m]=splitClue(l);if(m)pairs.push({w,m});else bad.push(w)});
  let order=[...pairs.keys()];if(pairs.length>1)for(let t=0;t<25;t++){shuffle(order);if(order.some((v,i)=>v!==i))break}
  return {pairs,order,bad};
}
function viewMatch(s){
  if(s.pairs.length<2)return emptyOut('Add at least two lines like “word - meaning”.');
  const body=key=>`<div class="match">${s.pairs.map((p,i)=>{const q=s.pairs[s.order[i]];
    return `<div class="mw l"><span><b>${i+1}.</b> ${esc(p.w)}</span><span class="pt">●</span></div><div></div><div class="mw r"><span class="pt">●</span><span style="flex:1"><span class="mnum">${key?s.order[i]+1:''}</span> ${esc(q.m)}</span></div>`}).join('')}</div>`;
  return {pages:[head(val('mtTitle'),val('mtInstr'))+body(false)],keys:[keyHead(val('mtTitle'))+body(true)],
    msg:s.bad.length?`Skipped ${list(s.bad)}: needs a meaning after a dash.`:`${s.pairs.length} pairs.`,ok:!s.bad.length};

/* ---------- bingo ---------- */
function buildBingo(){
  const words=[...new Set(lines('bgWords'))],n=+val('bgSize'),free=$('bgFree').checked&&n%2===1,need=n*n-(free?1:0);
  const count=Math.max(1,Math.min(60,parseInt(val('bgCount'))||1));
  if(words.length<need)return {short:true,need,have:words.length,n};
  const cards=[];for(let i=0;i<count;i++)cards.push(shuffle(words.slice()).slice(0,need));
  return {words,n,free,cards};
}
function viewBingo(s){
  if(s.short)return {...emptyOut(`A ${s.n} × ${s.n} card needs at least ${s.need} words. You have ${s.have}.`),msg:`Add ${s.need-s.have} more ${s.need-s.have===1?'word':'words'}, or choose a smaller card.`,ok:false};
  const per=+val('bgPer'),gw=per===2?400:620,cell=Math.floor(gw/s.n),mid=Math.floor(s.n*s.n/2);
  const card=ws=>{let k=0;const cells=[];
    for(let i=0;i<s.n*s.n;i++){if(s.free&&i===mid){cells.push(`<div class="bfree" style="font-size:${Math.round(cell*.2)}px">${esc(L().free)}</div>`);continue}
      const w=ws[k++],fs=Math.max(11,Math.floor(Math.min(cell*.26,cell*1.7/Math.max(3,w.length))));cells.push(`<div style="font-size:${fs}px">${esc(w)}</div>`)}
    return `<div class="bcard">${head(val('bgTitle'),'')}<div class="bgrid" style="grid-template-columns:repeat(${s.n},${cell}px);grid-auto-rows:${cell}px">${cells.join('')}</div></div>`};
  const pages=[];for(let i=0;i<s.cards.length;i+=per)pages.push(s.cards.slice(i,i+per).map(card).join(''));
  const slips=keyHead(val('bgTitle'),L().caller)+`<div class="slips">${s.words.map(w=>`<div>${esc(w)}</div>`).join('')}</div>`;

}

  const d=dlCap?await dlCap:null;
  if(d){try{await d.save({filename:name,data:blob});return true}
    catch(e){if(e&&e.code==='declined')return false;note('This view can’t save files. Open the page in its own tab and try again.');return false}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true;
}
const PW=816,PH=1056,PAD=48,SCALE=2.5;
async function pageCanvas(el){
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const box=document.createElement('div');
  box.style.cssText=`position:absolute;left:-12000px;top:0;width:${PW}px;padding:${PAD}px;background:#fff;box-sizing:border-box`;
  const clone=el.cloneNode(true);
  clone.style.cssText='margin:0;padding:0;max-width:none;box-shadow:none;border-radius:0;overflow:visible;background:#fff';
  box.appendChild(clone);document.body.appendChild(box);
  try{
    const shot=await html2canvas(box,{scale:SCALE,backgroundColor:'#ffffff',logging:false,windowWidth:Math.max(1240,window.innerWidth)});
    const pw=PW*SCALE,ph=PH*SCALE,c=document.createElement('canvas');c.width=pw;c.height=ph;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,pw,ph);
    const k=Math.min(1,ph/shot.height,pw/shot.width),w=shot.width*k,h=shot.height*k;
    x.drawImage(shot,(pw-w)/2,0,w,h);return c;
  }finally{box.remove()}
}
const sheets=()=>[...document.querySelectorAll('#pages .sheet')];
const baseName=()=>{const el=$(TYPES.find(t=>t[0]===type)[2]+'Title');const t=(el&&el.value.trim())||'puzzle';return t.replace(/[\\/:*?"<>|]+/g,'').slice(0,60)};
const toBlob=c=>new Promise(r=>c.toBlob(r,'image/jpeg',0.92));
async function busy(btn,fn){
  if(typeof html2canvas==='undefined'){note('The download tools didn’t load. Check the internet connection and reload.');return}
  const label=btn.textContent;btn.disabled=true;
  try{await fn(p=>btn.textContent=p)}catch(e){note('Something went wrong making the file. Try again.')}
  finally{btn.disabled=false;btn.textContent=label}
}
$('btnPdf').onclick=()=>busy($('btnPdf'),async prog=>{
  const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'in',format:'letter',orientation:'portrait'});
  const ps=sheets();
  for(let i=0;i<ps.length;i++){prog(`Page ${i+1} of ${ps.length}…`);const c=await pageCanvas(ps[i]);if(i)pdf.addPage('letter','portrait');pdf.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',0,0,8.5,11)}
  await saveFile(baseName()+'.pdf',pdf.output('blob'));
});
$('btnJpg').onclick=()=>busy($('btnJpg'),async prog=>{
  const ps=sheets();
  if(ps.length>2&&window.JSZip){
    const zip=new JSZip();
    for(let i=0;i<ps.length;i++){prog(`Page ${i+1} of ${ps.length}…`);zip.file(`${baseName()} ${String(i+1).padStart(2,'0')}.jpg`,await toBlob(await pageCanvas(ps[i])))}
    await saveFile(baseName()+'.zip',await zip.generateAsync({type:'blob'}));return;
  }
  for(let i=0;i<ps.length;i++){prog(`Page ${i+1} of ${ps.length}…`);const c=await pageCanvas(ps[i]);
    const ok=await saveFile(baseName()+(ps.length>1?' '+(i+1):'')+'.jpg',await toBlob(c));if(!ok)break}
});

let timer;
FIELDS.forEach(id=>{const el=$(id);
  el.addEventListener(el.tagName==='SELECT'||el.type==='checkbox'?'change':'input',()=>{
    save();clearTimeout(timer);
    if(el.hasAttribute('data-rebuild')){
      if(id==='yiMarks'){for(const k in S)S[k]=null}else S[PREFIX[id.slice(0,2)]]=null;
      timer=setTimeout(render,350);
    }else if(el.tagName==='TEXTAREA'||el.type==='text'||el.type==='number'){timer=setTimeout(render,250)}
    else render();
  });
});
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
$('btnNew').onclick=rebuild;
$('btnPrint').onclick=()=>window.print();
fillShapes();load();putContent(perLang[lang]);applyLang();
setType(type);
if(document.fonts){document.fonts.load('700 64px Heebo','שלום Abc');document.fonts.load('500 64px Heebo','שלום Abc');document.fonts.ready.then(()=>{if(type==='trace')render()})}
